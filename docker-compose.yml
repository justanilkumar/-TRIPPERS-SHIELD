services:
  mysql:
    image: mysql:8.0
    container_name: policyflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: policyflow
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: policyflow
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: policyflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: policyflow
      POSTGRES_USER: policyflow
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyflow -d policyflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: policyflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  pgsql_data:
  redis_data:
